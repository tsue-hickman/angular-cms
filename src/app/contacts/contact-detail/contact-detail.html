<div class="panel panel-default">
  <div class="panel-heading">
    {{ contact.name }}
    <img
      [src]="contact.imageUrl"
      alt="{{ contact.name }}"
      class="img-responsive pull-right"
      style="max-height: 50px"
    />
  </div>
  <div class="panel-body">
    <div class="row">
      <div class="col-xs-12">
        <div class="row"><label>Email:</label> {{ contact.email }}</div>
        <div class="row"><label>Phone:</label> {{ contact.phone }}</div>
      </div>
    </div>
    <div class="row">
      <div class="col-xs-12">
        <a class="btn btn-primary" [routerLink]="['edit']">Edit</a>
        <a class="btn btn-danger" (click)="onDelete()">Delete</a>
      </div>
    </div>
  </div>
</div>
